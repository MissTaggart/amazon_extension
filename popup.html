<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Order Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div>
          <h1 data-i18n="title">Amazon Orders</h1>
          <p class="subtitle" data-i18n="subtitle">Orders with tracking</p>
        </div>
        <div class="header-actions">
          <div class="lang-switcher">
            <button id="lang-en" class="lang-btn active" title="English">EN</button>
            <button id="lang-ru" class="lang-btn" title="Русский">RU</button>
          </div>
          <button id="refresh-btn" class="btn-refresh-icon" data-i18n-title="refreshOrders">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div id="status" class="status hidden"></div>

    <div id="not-amazon" class="message hidden">
      <p data-i18n="openAmazonPrompt">Open Amazon Orders page to view tracking:</p>
      <a href="https://www.amazon.com/gp/your-account/order-history" target="_blank" class="btn-go-amazon" data-i18n="openAmazonBtn">
        Open Amazon Orders
      </a>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p data-i18n="loading">Loading orders...</p>
    </div>

    <div id="orders-container" class="orders-container">
      <div id="orders-list" class="orders-list"></div>
      <div id="no-orders" class="message hidden">
        <p data-i18n="noOrders">No orders with tracking numbers found.</p>
        <button id="refresh-btn-fallback" class="btn-refresh" data-i18n="refreshBtn">
          Refresh Orders
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
